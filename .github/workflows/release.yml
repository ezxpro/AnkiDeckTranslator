name: Release
# Every push to main: test, compute the next version from Conventional Commits,
# tag it, build Linux + Windows binaries and publish a GitHub Release.
#   feat!: / BREAKING CHANGE -> major   feat: -> minor   fix:/perf: -> patch
# Other commits (docs, chore, ...) alone do not create a release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}   # empty = no release
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        run: |
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then base=0.0.0; range=HEAD; else base=${last#v}; range="$last..HEAD"; fi
          if [ -n "$last" ] && [ "$(git rev-parse "$last^{commit}")" = "$(git rev-parse HEAD)" ]; then
            echo "HEAD already tagged $last"; exit 0
          fi
          log=$(git log "$range" --format='%s%n%b%n--END--')
          level=""
          if echo "$log" | grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE'; then level=major
          elif echo "$log" | grep -qE '^feat(\([^)]*\))?:'; then level=minor
          elif echo "$log" | grep -qE '^(fix|perf)(\([^)]*\))?:'; then level=patch
          fi
          # First release: start at 0.1.0 regardless of history.
          if [ -z "$last" ]; then next=0.1.0
          elif [ -z "$level" ]; then echo "No releasable commits since $last"; exit 0
          else
            IFS=. read -r M m p <<< "$base"
            case $level in
              major) if [ "$M" = 0 ]; then m=$((m+1)); p=0; else M=$((M+1)); m=0; p=0; fi ;;  # 0.x: breaking bumps minor
              minor) m=$((m+1)); p=0 ;;
              patch) p=$((p+1)) ;;
            esac
            next="$M.$m.$p"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[deepl,gemini,dev]"
      - run: pytest -q

  build:
    needs: [version, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04        # older glibc = runs on more distros
            asset: ankitool-linux-x86_64
          - os: windows-latest
            asset: ankitool-windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Stamp version
        shell: bash
        run: sed -i "s/^VERSION = .*/VERSION = \"$VERSION\"/" src/ankitool/core/constants.py
      - run: pip install ".[deepl,gemini]" pyinstaller httpx
      - name: Build
        shell: bash
        run: |
          pyinstaller --onefile --name ankitool --paths src \
            --collect-all anki --collect-all deepl --collect-all google.genai \
            --collect-submodules ankitool \
            packaging/entry.py
      - name: Smoke test
        shell: bash
        run: |
          out=$(./dist/ankitool --version)
          echo "$out"
          echo "$out" | grep -q "$VERSION"
      - name: Package
        shell: bash
        run: |
          mkdir out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/ankitool.exe "out/${{ matrix.asset }}.exe"
          else
            tar -czf "out/${{ matrix.asset }}.tar.gz" -C dist ankitool   # keeps the executable bit
            # AppImage: single file, runs on most distros (needs chmod +x after download)
            mkdir -p AppDir/usr/bin
            cp dist/ankitool AppDir/usr/bin/ankitool
            cp packaging/ankitool.desktop packaging/ankitool.png AppDir/
            printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/ankitool" "$@"\n' > AppDir/AppRun
            chmod +x AppDir/AppRun
            curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x appimagetool
            ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir "out/${{ matrix.asset }}.AppImage"
            APPIMAGE_EXTRACT_AND_RUN=1 "./out/${{ matrix.asset }}.AppImage" --version | grep -q "$VERSION"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: out/*
