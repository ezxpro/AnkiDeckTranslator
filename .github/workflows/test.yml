name: Tests
on:
  pull_request:
  push:
    branches-ignore: [main]   # main is tested by the release workflow
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[deepl,gemini,dev]"
      - run: pytest -q
