[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ankitool"
dynamic = ["version"]
description = "Translate, reverse and inspect Anki decks (.apkg)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["anki"]

[project.optional-dependencies]
deepl = ["deepl"]
gemini = ["google-genai"]
dev = ["pytest"]

[project.scripts]
ankitool = "ankitool.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "ankitool.core.constants.VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
